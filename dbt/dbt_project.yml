name: olist
version: "1.0.0"
config-version: 2
profile: olist

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # complete months only: 2016 is sparse and Sep-Oct 2018 have a handful of orders
  analysis_start: "2017-01-01"
  analysis_end: "2018-09-01"
  min_seller_orders: 30

models:
  olist:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

tests:
  olist:
    +store_failures: false
